name: Live smoke test

# Verifies the DEPLOYED site end-to-end: assets execute (KaTeX/marked/DOMPurify),
# math renders, brand fonts load, security headers present, /api streams.
# Deploys are manual (tofu apply), so this runs nightly and on demand —
# trigger it manually right after each deploy.

on:
  workflow_dispatch:
  schedule:
    - cron: "23 9 * * *" # daily, 09:23 UTC (~05:23 in Barbados)

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Smoke test live site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright (chromium)
        run: |
          npm init -y >/dev/null
          npm i playwright@1 >/dev/null
          npx playwright install --with-deps chromium

      - name: Run smoke checks
        env:
          BASE_URL: https://sumdeting.246labs.cloud
        run: node .github/smoke/smoke.mjs
