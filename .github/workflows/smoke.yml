name: Live smoke test

# Verifies the DEPLOYED site end-to-end: assets execute (KaTeX/marked/DOMPurify),
# math renders, brand fonts load, security headers present, /api streams.
# Runs after every deploy (deploy.yml calls it), nightly, and on demand.

on:
  workflow_call:
    inputs:
      strict_csp:
        description: "Require a 'self'-only CSP: \"true\" or \"false\" (false while cdnjs is still allowed)"
        type: string
        default: "true"
  workflow_dispatch:
  schedule:
    - cron: "23 9 * * *" # daily, 09:23 UTC (~05:23 in Barbados)

concurrency:
  # In a workflow_call run, github.workflow is the caller's name ("Deploy"), so deploy smoke runs
  # and scheduled/manual runs get separate groups and can't cancel each other.
  group: smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Smoke test live site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: Install Playwright (chromium)
        run: |
          npm init -y >/dev/null
          npm i playwright@1.65.0 >/dev/null
          npx playwright install --with-deps chromium

      - name: Run smoke checks
        env:
          BASE_URL: https://sumdeting.246labs.cloud
          # Scheduled and manual runs have no inputs, so they default to strict.
          STRICT_CSP: ${{ inputs.strict_csp == 'false' && 'false' || 'true' }}
        run: node .github/smoke/smoke.mjs
