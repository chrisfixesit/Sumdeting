name: PR Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: pr-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tofu:
    name: OpenTofu (fmt / init / validate)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f # v1
        with:
          tofu_version: 1.8.0
          tofu_wrapper: false

      - name: tofu fmt -check -recursive
        run: tofu fmt -check -recursive

      - name: tofu init (no backend)
        run: tofu init -backend=false

      - name: tofu validate
        run: tofu validate

  unit:
    name: Backend (unit tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run unit tests
        run: npm test

  backend:
    name: Backend (node --check)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: Syntax-check .mjs files
        run: |
          shopt -s nullglob
          files=(*.mjs account/*.mjs)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No .mjs files found in backend/"
            exit 0
          fi
          for f in "${files[@]}"; do
            echo "node --check $f"
            node --check "$f"
          done
        shell: bash

  docker:
    name: Docker (build + serve the site)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build image
        run: docker build -t sumdeting:ci .

      - name: Every page, module and image is served
        run: |
          docker run -d --name app -p 127.0.0.1:8080:8080 sumdeting:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/healthz >/dev/null && break; sleep 1; done
          # Read the list from web/ itself, so a new file is checked without editing this job.
          status=0
          for f in web/* web/vendor/fonts/fonts.css web/vendor/katex-0.16.21/katex.min.js; do
            [ -f "$f" ] || continue
            case "$f" in *.test.mjs) continue ;; esac
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8080/${f#web/}")
            echo "$code /${f#web/}"
            [ "$code" = 200 ] || status=1
          done
          [ "$status" = 0 ] || docker logs app
          exit "$status"
        shell: bash

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: Install backend dependencies
        working-directory: backend
        run: npm install --no-audit --no-fund

      - name: Install e2e dependencies
        working-directory: e2e
        run: npm ci --no-audit --no-fund

      - name: Install Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: e2e
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7
