services:
  mathmentor:
    build: .
    ports:
      # Localhost only: the container uses your own AWS credentials, so don't
      # expose it to the rest of the network. Needs Docker Engine 28.0.0+:
      # older Linux engines let hosts on the same L2 network reach ports
      # published on 127.0.0.1.
      - "127.0.0.1:8080:8080"
    environment:
      # Bedrock model/inference profile (must be enabled in your account)
      MODEL_ID: ${MODEL_ID:-us.anthropic.claude-haiku-4-5-20251001-v1:0}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      # Accounts in local development. ACCOUNT_DEV=1 keeps accounts in memory
      # (lost on restart), exposes sign-in emails at GET /api/account/_dev/outbox
      # instead of sending them, and drops the Secure flag from the session
      # cookie so it works over http://localhost. NEVER set it in production:
      # the outbox hands out sign-in links to anyone who can reach the port.
      # Off unless you opt in: `ACCOUNT_DEV=1 docker compose up --build`.
      ACCOUNT_DEV: ${ACCOUNT_DEV:-0}
      # Credentials come from the ~/.aws mount below by default.
      # To use static/session creds or a named profile instead, export them
      # in your shell before `docker compose up`; compose passes them through:
      # AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_SESSION_TOKEN, AWS_PROFILE
    volumes:
      # Read-only AWS config/credentials for local development
      - ~/.aws:/home/node/.aws:ro
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
